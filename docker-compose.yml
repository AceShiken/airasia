version: '3.8'

services:
  currency-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: currency-conversion-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - OPENEXCHANGERATES_API_KEY=${OPENEXCHANGERATES_API_KEY:-YOUR_API_KEY_HERE}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - currency-network

networks:
  currency-network:
    driver: bridge
